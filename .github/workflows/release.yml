name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to attach assets to (e.g., v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and upload Linux binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Show toolchain
        run: |
          rustc -Vv
          cargo -V

      - name: Build musl release (static)
        env:
          # Prefer vendored zstd and avoid dynamic system libzstd via pkg-config
          ZSTD_SYS_USE_PKG_CONFIG: "0"
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Package binary (tar.gz)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          TARGET="x86_64-unknown-linux-musl"
          BIN_PATH="target/${TARGET}/release/shard-json-array"
          strip -s "$BIN_PATH" || true
          tar -C "target/${TARGET}/release" -czf "dist/shard-json-array-${TARGET}.tar.gz" shard-json-array

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "::error::Missing required input 'tag' for workflow_dispatch"
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ steps.tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
