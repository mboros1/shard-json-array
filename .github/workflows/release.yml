name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to attach assets to (e.g., v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and upload Linux binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain
        run: |
          rustc -Vv
          cargo -V

      - name: Build release
        run: cargo build --locked --release

      - name: Package binary (tar.gz)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          BIN_PATH="target/release/shard-json-array"
          strip -s "$BIN_PATH" || true
          ARCH="$(uname -m)"
          tar -C target/release -czf "dist/shard-json-array-linux-${ARCH}.tar.gz" shard-json-array

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
